version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_escolar
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  python-workers:
    build:
      context: ./python
    container_name: sistema_python_workers
    ports:
      - "8001:8001"
    environment:
      - PYTHON_ENV=production
      - PYTHON_API_SECRET=${PYTHON_API_SECRET:-dev-secret-key}
    volumes:
      - ./python/app:/app/app
    depends_on:
      - db
      - redis

volumes:
  db_data:
